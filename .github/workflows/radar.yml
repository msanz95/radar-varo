name: RADAR VARO · Observe and publish
on:
  workflow_dispatch:
    inputs:
      notification_test:
        description: 'Enviar prueba técnica al canal ntfy configurado'
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore: ['web/data/**', 'docs/**', 'evidence/**', 'README.md']
  schedule:
    - cron: '2,17,32,47 0-7,11-19 * * *'
    - cron: '2-57/5 8-10,20-23 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: radar-varo-main
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Recover existing checkpoint source on first publication
        if: ${{ hashFiles('radar/core.py') == '' }}
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile('RADAR_VARO_CHECKPOINT_2026-10-12.zip') as archive:
              for item in archive.infolist():
                  path = Path(item.filename).relative_to('radar-varo')
                  if item.is_dir() or '.github' in path.parts:
                      continue
                  if '..' in path.parts or path.is_absolute():
                      raise ValueError('Invalid checkpoint path')
                  if path.exists():
                      continue
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_bytes(archive.read(item))
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Engine, parser, data integrity and deduplication
        run: python -m unittest discover -s tests -v
      - name: Install public-page renderer
        run: |
          pip install -r requirements-renderer.txt
          python -m playwright install --with-deps chromium
      - name: Observe public surfaces
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python -m radar.scan --rendered ${{ github.event_name != 'schedule' && '--force' || '' }}
      - name: Commit observations and pending alerts before delivery
        run: |
          git config user.name 'radar-varo-bot'
          git config user.email 'radar-varo-bot@users.noreply.github.com'
          git add web/data
          if ! git diff --cached --quiet; then
            git commit -m 'data: persist real radar observation'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Deliver fresh personal alerts with deduplication and retries
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python -m radar.delivery
      - name: Send requested phone connection test
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.notification_test }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python -m radar.delivery --test
      - name: Persist delivery receipts even after a notification error
        if: ${{ always() && !cancelled() }}
        run: |
          git config user.name 'radar-varo-bot'
          git config user.email 'radar-varo-bot@users.noreply.github.com'
          git add web/data
          if ! git diff --cached --quiet; then
            git commit -m 'data: persist alert delivery receipts'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Validate public bundle
        run: python -m radar.verify
      - name: Check mobile, desktop and interactions
        if: github.event_name != 'schedule'
        run: python tests/browser_qa.py
      - name: Preserve browser QA evidence
        if: github.event_name != 'schedule'
        uses: actions/upload-artifact@v4
        with:
          name: radar-ui-${{ github.run_id }}
          path: qa-results
          retention-days: 7
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Save scan evidence
        uses: actions/upload-artifact@v4
        with:
          name: radar-scan-${{ github.run_id }}
          path: web/data/evidence.json
          retention-days: 7
  publish:
    needs: observe
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish exact observed state
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare independent live PWA verification
        if: github.event_name != 'schedule'
        run: |
          pip install -r requirements-renderer.txt
          python -m playwright install --with-deps chromium
      - name: Verify public HTTPS, prices, mobile PWA and offline shell
        if: github.event_name != 'schedule'
        env:
          PUBLIC_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import json, os, re, struct
          from pathlib import Path
          from urllib.parse import urljoin, urlsplit
          from playwright.sync_api import sync_playwright
          url=os.environ['PUBLIC_URL']
          assert url.startswith('https://')
          output=Path('qa-public');output.mkdir(exist_ok=True)
          with sync_playwright() as pw:
              browser=pw.chromium.launch()
              context=browser.new_context(viewport={'width':390,'height':844},is_mobile=True,has_touch=True)
              page=context.new_page();errors=[];broken=[]
              page.on('pageerror',lambda error:errors.append(str(error)))
              page.on('response',lambda response:broken.append({'url':response.url,'status':response.status}) if response.status>=400 and urlsplit(response.url).netloc==urlsplit(url).netloc else None)
              response=page.goto(url,wait_until='networkidle',timeout=60000)
              assert response.status==200
              page.get_by_role('heading',name='SISTEMA AUTÓNOMO').wait_for()
              page.locator('#system-state').filter(has_not_text='…').wait_for()
              snapshot=context.request.get(urljoin(url,'data/dashboard.json')).json()
              assert snapshot['status']['automation']=='github_actions'
              assert snapshot['products'], 'Real prices are required'
              manifest=context.request.get(urljoin(url,'manifest.webmanifest')).json()
              assert manifest['display']=='standalone' and manifest['start_url']=='./'
              for icon in manifest['icons']:
                  icon_response=context.request.get(urljoin(url,icon['src']))
                  assert icon_response.status==200
                  size=struct.unpack('>II',icon_response.body()[16:24])
                  assert f'{size[0]}x{size[1]}'==icon['sizes']
              worker=page.evaluate("async()=>{const r=await navigator.serviceWorker.ready;return {scope:r.scope,state:r.active.state,script:r.active.scriptURL}}")
              assert worker['state']=='activated'
              assert worker['scope']==url
              page.get_by_role('button',name='Telcel',exact=True).click()
              page.locator('.offer').first.wait_for()
              assert page.locator('.offer').count()==len([p for p in snapshot['products'] if p['present']])
              for width in [360,390,1365]:
                  page.set_viewport_size({'width':width,'height':844 if width<600 else 960})
                  assert page.evaluate('document.documentElement.scrollWidth<=innerWidth'), f'Overflow {width}'
              page.set_viewport_size({'width':390,'height':844})
              if page.locator('.product-visual img').count():
                  page.locator('.product-visual img').first.evaluate('(img)=>img.decode()')
              page.locator('[data-detail]').first.click()
              page.locator('#detail-history .history-row').first.wait_for()
              page.locator('#product-detail').get_by_role('button',name='Cerrar',exact=True).click()
              page.get_by_role('button',name='Movimientos',exact=True).click()
              assert 'Movimientos del radar' in page.locator('#feed-title').inner_text()
              page.get_by_role('button',name='Alertas',exact=True).click()
              page.screenshot(path=str(output/'mobile.png'),full_page=True)
              cached=page.evaluate("async()=>{const names=await caches.keys();const requests=await Promise.all(names.map(async n=>(await (await caches.open(n)).keys()).map(r=>r.url)));return requests.flat()}")
              assert not any('/data/' in entry for entry in cached), 'Prices must never enter the offline shell cache'
              assert not errors,errors
              assert not broken,broken
              context.set_offline(True)
              page.reload(wait_until='domcontentloaded')
              page.get_by_role('heading',name='SISTEMA AUTÓNOMO').wait_for()
              page.get_by_text('SIN CONEXIÓN',exact=True).wait_for()
              context.set_offline(False)
              page.reload(wait_until='networkidle')
              page.locator('#system-state').filter(has_text=re.compile(r'^(ACTIVO|PARCIAL|SIN LECTURA|ATRASADO)$')).wait_for()
              report={'url':url,'https':'PASS','live_prices':len(snapshot['products']),'last_scan':snapshot['status']['last_attempt'],'viewports':[360,390,1365],'navigation':'PASS','resources':'PASS','history':'PASS','worker':worker,'offline_shell':'PASS','data_cache':'PASS','console_errors':errors}
              (output/'verification.json').write_text(json.dumps(report,indent=2))
              print(json.dumps(report))
              browser.close()
          PY
      - name: Preserve live PWA verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-public-${{ github.run_id }}
          path: qa-public
          retention-days: 7
